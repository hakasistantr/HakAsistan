<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAK Asistan</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      text-align: center;
    }

    header {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    .hero {
      padding: 60px 20px;
    }

    .maskot {
      font-size: 70px;
    }

    h1 {
      font-size: 38px;
      margin: 15px 0;
    }

    p {
      color: #60697a;
      font-size: 18px;
    }

    textarea {
      width: 90%;
      max-width: 650px;
      height: 140px;
      margin-top: 25px;
      padding: 18px;
      border: 2px solid #ddd;
      border-radius: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      display: block;
      margin: 15px auto;
      padding: 15px 30px;
      border: none;
      border-radius: 12px;
      background: #5b4bdb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .alanlar {
      padding: 20px;
    }

    .kart {
      display: inline-block;
      background: white;
      margin: 6px;
      padding: 18px;
      border-radius: 12px;
      width: 130px;
    }
  </style>
</head>

<body>

<header>
  🛡️ HAK ASİSTAN
</header>

<section class="hero">

  <div class="maskot">🦉</div>

  <h1>Sorununu anlat.<br>Haklarını öğren.</h1>

  <p>
    Yaşadığın sorunu kendi cümlelerinle anlat.
    HakAsistan sana hangi adımları atabileceğini göstermeye yardımcı olsun.
  </p>

  <textarea placeholder="Örneğin: Ev sahibim depozitomu vermiyor..."></textarea>

  <button onclick="sorunGonder()">
    Haklarımı Öğren →
  </button>

</section>

<section class="alanlar">

  <h2>Hangi konuda sorun yaşıyorsun?</h2>

  <div class="kart">🏠<br>Kira & Ev</div>
  <div class="kart">🛒<br>Tüketici</div>
  <div class="kart">💼<br>İş & Çalışma</div>
  <div class="kart">🚗<br>Trafik & Araç</div>
  <div class="kart">🏛️<br>Devlet & Kamu</div>
  <div class="kart">💳<br>Banka & Para</div>
  <div class="kart">📄<br>Sözleşmeler</div>

</section>

<script>
function sorunGonder() {
  alert("Sorunun alındı. HakAsistan'ın yapay zekâ sistemi bir sonraki aşamada devreye girecek.");
}
</script>

</body>
</html>
